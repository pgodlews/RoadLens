[project]
name = "roadlens"
version = "0.1.0"
description = "Post-ride road-hazard analysis for Garmin camera footage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=11.0",
]

[project.scripts]
roadlens = "roadlens.cli:main"

[project.optional-dependencies]
local = [
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    "decord",
    "einops",
    "hydra-core",
    "opencv-python-headless",
    "psutil",
    "pycocotools",
    "scikit-image",
    "scipy",
    "setuptools<81",
    "torch==2.10.0",
    "torchcodec",
    "torchvision",
    "av>=14",
]
remote = [
    "meta_sam_parser",
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
